name: core-saas

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: core-saas-backend
    container_name: core-saas-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    # La configuración de Laravel sale solo del .env (no inyectar DB_*/CACHE_* aquí:
    # las variables del contenedor pisarían las de phpunit.xml y los tests usarían la BD de desarrollo)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-saas-network

  server:
    image: nginx:stable-alpine
    container_name: core-saas-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - core-saas-network

  db:
    image: mysql:9.7
    container_name: core-saas-db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-33061}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-core_saas}
      MYSQL_USER: ${DB_USERNAME:-core_saas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      # Prefijo de las BD de tenants sobre las que el usuario de la app tiene permisos (ver docker/mysql/init)
      TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-tenant_}
    # Datos persistidos en disco del host (bind mount), sobreviven a `down -v` y a recrear el contenedor
    volumes:
      - ${DB_DATA_PATH:-./docker/data/mysql}:/var/lib/mysql
      # Solo se ejecuta cuando el directorio de datos está vacío (primera inicialización)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - core-saas-network

  redis:
    image: redis:8.10-alpine
    container_name: core-saas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-63791}:6379"
    # Datos persistidos en disco del host (bind mount), igual que la BD
    volumes:
      - ${REDIS_DATA_PATH:-./docker/data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-saas-network

  node:
    image: node:26-alpine
    container_name: core-saas-node
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    # Instala dependencias y levanta Vite en modo dev (HMR). Para compilar: docker compose exec node npm run build
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    networks:
      - core-saas-network

networks:
  core-saas-network:
    name: core-saas-network
    driver: bridge
