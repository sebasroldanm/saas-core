name: core-saas

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: core-saas-backend
    container_name: core-saas-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    # Las variables reales del contenedor tienen prioridad sobre las del .env de Laravel
    environment:
      APP_NAME: core-saas
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: core-saas-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-core_saas}
      DB_USERNAME: ${DB_USERNAME:-core_saas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: phpredis
      REDIS_HOST: core-saas-redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-saas-network

  server:
    image: nginx:stable-alpine
    container_name: core-saas-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - core-saas-network

  db:
    image: mysql:9.7
    container_name: core-saas-db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-core_saas}
      MYSQL_USER: ${DB_USERNAME:-core_saas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - core-saas-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - core-saas-network

  redis:
    image: redis:8.10-alpine
    container_name: core-saas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - core-saas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-saas-network

networks:
  core-saas-network:
    name: core-saas-network
    driver: bridge

volumes:
  core-saas-db-data:
    name: core-saas-db-data
  core-saas-redis-data:
    name: core-saas-redis-data
